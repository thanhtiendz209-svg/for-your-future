version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.api
    container_name: fyf-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=For Your Future
      - PROJECT_NAME=for-your-future
      - API_V1_STR=/api/v1
      - DATABASE_URL=${DATABASE_URL:-postgresql://avnadmin:your_aiven_password_here@pg-1a5f2827-thanhtiendz209-1f86.b.aivencloud.com:26350/defaultdb?sslmode=require}
      - ASYNC_DATABASE_URL=${ASYNC_DATABASE_URL:-postgresql+asyncpg://avnadmin:your_aiven_password_here@pg-1a5f2827-thanhtiendz209-1f86.b.aivencloud.com:26350/defaultdb}
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-sitk2023}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-flash-lite-latest}
    depends_on:
      - neo4j

  neo4j:
    image: neo4j:5-community
    container_name: fyf-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:-neo4j/sitk2023}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:

